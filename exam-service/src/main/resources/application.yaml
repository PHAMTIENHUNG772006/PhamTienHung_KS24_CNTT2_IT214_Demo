server:
  port: 8080

spring:
  application:
    name: exam-service
  datasource:
    url: jdbc:mysql://localhost:3306/exam_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Cấu hình Hibernate / JPA cho MySQL
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
